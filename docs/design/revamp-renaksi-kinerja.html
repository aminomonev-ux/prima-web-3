<!DOCTYPE html>
<html lang="id" data-theme="dark" data-concept="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIMA — Revamp UI: Renaksi &amp; Kinerja (3 Konsep)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PRIMA — Mockup revamp UI Renaksi & Kinerja
   Semua warna diambil dari docs/design/DESIGN-SYSTEM.md. Tidak ada hex baru.
   ═══════════════════════════════════════════════════════════════════════════ */

:root[data-theme="dark"]{
  --canvas:#020F1C; --card:#042C53; --elev:#0C447C; --hover:#185FA5;
  --hair:#0C447C; --hair-active:#185FA5;
  --text:#E6F1FB; --text2:#B5D4F4; --muted:#85B7EB;
  --shell:#042C53; --shell-2:#020F1C;
  --zebra:rgba(12,68,124,.22);
  --scrim:rgba(2,15,28,.72);
}
:root[data-theme="light"]{
  --canvas:#F5F5F7; --card:#FAFAFA; --elev:#F1EFE8;
  --hover:color-mix(in srgb, #D3D1C7 45%, #FAFAFA);
  --hair:#D3D1C7; --hair-active:#378ADD;
  --text:#042C53; --text2:#185FA5; --muted:#378ADD;
  --shell:#FAFAFA; --shell-2:#F1EFE8;
  --zebra:rgba(211,209,199,.24);
  --scrim:rgba(245,245,247,.72);
}
:root{
  --primary:#EF9F27; --primary-hover:#FAC775; --primary-bg:#633806; --on-primary:#020F1C;
  --success:#1D9E75; --success-hover:#158A62; --success-bg:#085041;
  --danger:#E24B4A;  --danger-hover:#C0392B; --danger-bg:#791F1F;
  --purple:#7C5CFC;  --purple-hover:#6344E0; --purple-bg:#2D1A6E;
  --warning:#BA7517; --warning-hover:#9A5F10; --warning-bg:#633806;
  --info:#378ADD;    --info-bg:#0C447C;
  --on-action:#FFFFFF;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--canvas); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.ico{flex-shrink:0}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
select,input{font-family:inherit; color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--elev); border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--hover)}
::-webkit-scrollbar-track{background:transparent}

/* ───────────────────────── Chrome mockup (bukan bagian desain) ───────────── */
.mockbar{
  display:flex; align-items:center; gap:14px; padding:0 16px; height:52px; flex-shrink:0;
  background:var(--shell-2); border-bottom:1px solid var(--hair); z-index:60;
}
.mockbar .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:13px; letter-spacing:.2px}
.mockbar .brand .dot{width:22px;height:22px;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.seg{display:flex; background:var(--card); border:1px solid var(--hair); border-radius:var(--r-sm); padding:2px; gap:2px}
.seg button{padding:5px 12px; border-radius:4px; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--primary); color:var(--on-primary)}
.seg.alt button.on{background:var(--elev); color:var(--text)}
.mockbar .spacer{flex:1}
.iconbtn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--hair);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--text); border-color:var(--hair-active)}
.mocknote{font-size:11px;color:var(--muted);font-weight:500}

/* ───────────────────────── Panel catatan konsep ──────────────────────────── */
.notes{
  flex-shrink:0; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--hair);
  display:flex; gap:14px; align-items:flex-start; font-size:12px;
}
.notes .tag{
  flex-shrink:0; padding:3px 9px; border-radius:99px; font-weight:800; font-size:10.5px;
  letter-spacing:.5px; background:var(--primary-bg); color:var(--primary); border:1px solid var(--primary);
}
.notes b{color:var(--text)}
.notes span{color:var(--text2); line-height:1.6}
.notes .close{margin-left:auto; color:var(--muted); flex-shrink:0}

/* ───────────────────────── Stage / app frame ─────────────────────────────── */
#stage{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.app{flex:1; min-height:0; display:flex; overflow:hidden; background:var(--canvas)}

/* sidebar (Konsep A) */
.sb{width:258px; flex-shrink:0; background:var(--shell); border-right:1px solid var(--hair);
    display:flex; flex-direction:column; overflow:hidden}
.sb-head{padding:16px 16px 14px; border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:10px}
.sb-logo{width:32px;height:32px;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.sb-title{font-size:12.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.sb-sub{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;margin-top:1px}
.sb-year{margin:12px 12px 4px}
.sb-year select,.field select,.field input{
  width:100%; background:var(--elev); border:1px solid var(--hair); border-radius:var(--r-sm);
  padding:7px 9px; font-size:12.5px; font-weight:600; outline:none;
}
.sb-year select:focus,.field select:focus,.field input:focus{border-color:var(--hair-active)}
.sb-nav{flex:1; overflow-y:auto; padding:6px 0 16px}
.sb-lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:14px 18px 5px; opacity:.85}
.navitem{display:flex; align-items:center; gap:10px; width:calc(100% - 16px); margin:1px 8px;
  padding:8px 10px; border-radius:var(--r-sm); font-size:13px; font-weight:600; color:var(--text2);
  text-align:left; border-left:2px solid transparent}
.navitem:hover{background:var(--zebra); color:var(--text)}
.navitem.on{background:var(--elev); color:var(--text); font-weight:700; border-left-color:var(--primary)}
.navitem.on .ico{color:var(--primary)}
.navitem .ico{color:var(--muted)}
.navitem .tail{margin-left:auto; font-size:10.5px; color:var(--muted); font-weight:700}
.navitem .pip{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.7;flex-shrink:0}
.navsub{padding-left:16px}
.navsub .navitem{font-size:12.5px; font-weight:500; padding:6px 10px}
.navsub .navitem.on{font-weight:700}
.sb-foot{padding:11px 16px; border-top:1px solid var(--hair); font-size:10.5px; color:var(--muted); font-weight:600}

/* rail + panel konteks (Konsep B) */
.rail{width:62px; flex-shrink:0; background:var(--shell-2); border-right:1px solid var(--hair);
      display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:6px}
.rail .rlogo{width:34px;height:34px;border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;margin-bottom:8px}
.rail button{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--muted);
  position:relative}
.rail button:hover{background:var(--zebra); color:var(--text)}
.rail button.on{background:var(--elev); color:var(--primary)}
.rail button.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.rail .rsep{width:26px;height:1px;background:var(--hair);margin:6px 0}
.ctxpanel{width:236px; flex-shrink:0; background:var(--shell); border-right:1px solid var(--hair);
  display:flex; flex-direction:column; overflow:hidden}
.ctxpanel .ch{padding:15px 16px 12px; border-bottom:1px solid var(--hair)}
.ctxpanel .ch h3{font-size:13px; font-weight:800}
.ctxpanel .ch p{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:2px}

/* topbar horizontal (Konsep C) */
.topnav{flex-shrink:0; background:var(--shell); border-bottom:1px solid var(--hair)}
.topnav .row1{display:flex; align-items:center; gap:14px; padding:10px 18px}
.topnav .row2{display:flex; align-items:stretch; gap:2px; padding:0 12px; overflow-x:auto; border-top:1px solid var(--hair)}
.topnav .row2 button{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--text2); white-space:nowrap;
  border-bottom:2px solid transparent}
.topnav .row2 button:hover{color:var(--text); background:var(--zebra)}
.topnav .row2 button.on{color:var(--primary); border-bottom-color:var(--primary); font-weight:700}
.topnav .modtab{display:flex; gap:4px; background:var(--elev); border-radius:var(--r-sm); padding:3px}
.topnav .modtab button{padding:6px 14px; border-radius:5px; font-size:12.5px; font-weight:700; color:var(--muted);
  display:flex; align-items:center; gap:7px}
.topnav .modtab button.on{background:var(--primary); color:var(--on-primary)}

/* command bar (Konsep B) */
.cmdbar{display:flex; align-items:center; gap:12px; padding:11px 18px; border-bottom:1px solid var(--hair);
  background:var(--shell); flex-shrink:0}
.crumb{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); font-weight:600}
.crumb b{color:var(--text); font-weight:700}
.cmdk{display:flex; align-items:center; gap:8px; background:var(--elev); border:1px solid var(--hair);
  border-radius:var(--r-sm); padding:6px 10px; font-size:12px; color:var(--muted); min-width:230px}
.cmdk kbd{margin-left:auto; font-family:var(--mono); font-size:10px; background:var(--card);
  border:1px solid var(--hair); border-radius:4px; padding:1px 5px}

/* ───────────────────────── Content ──────────────────────────────────────── */
.main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.pagehead{padding:18px 24px 14px; display:flex; align-items:flex-end; gap:16px; flex-shrink:0}
.pagehead h1{font-size:19px; font-weight:800; letter-spacing:-.2px}
.pagehead p{font-size:12.5px; color:var(--muted); font-weight:500; margin-top:3px}
.pagehead .acts{margin-left:auto; display:flex; gap:8px; flex-shrink:0}
.body{flex:1; overflow:auto; padding:0 24px 26px}

/* button — cermin PrimaButton */
.btn{display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:var(--r-sm);
  font-size:12.5px; font-weight:700; border:1px solid transparent; white-space:nowrap; transition:.14s}
.btn.sm{padding:5px 10px; font-size:11.5px}
.btn-primary{background:var(--primary); color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-success{background:var(--success); color:var(--on-action)}
.btn-success:hover{background:var(--success-hover)}
.btn-danger{background:var(--danger); color:var(--on-action)}
.btn-danger:hover{background:var(--danger-hover)}
.btn-purple{background:var(--purple); color:var(--on-action)}
.btn-purple:hover{background:var(--purple-hover)}
.btn-warning{background:var(--warning); color:var(--on-primary)}
.btn-warning:hover{background:var(--warning-hover)}
.btn-ghost{background:transparent; color:var(--text2); border-color:var(--hair)}
.btn-ghost:hover{border-color:var(--hair-active); color:var(--text)}

/* card */
.card{background:var(--card); border:1px solid var(--hair); border-radius:var(--r-md)}
.card-h{padding:13px 16px; border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:10px}
.card-h h3{font-size:13.5px; font-weight:700}
.card-h .sub{font-size:11px; color:var(--muted); font-weight:600}
.card-h .acts{margin-left:auto; display:flex; gap:6px}
.card-b{padding:16px}

/* KPI */
.kpigrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:18px}
.kpi{background:var(--card); border:1px solid var(--hair); border-radius:var(--r-md); padding:14px 15px;
  position:relative; overflow:hidden}
.kpi::after{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent,var(--primary))}
.kpi .lb{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:6px}
.kpi .vl{font-family:var(--mono); font-size:21px; font-weight:700; margin-top:7px; letter-spacing:-.5px}
.kpi .sb2{font-size:11px; color:var(--text2); font-weight:600; margin-top:3px}

/* KPI ribbon (Konsep C) */
.ribbon{display:flex; flex-wrap:wrap; gap:0; background:var(--card); border:1px solid var(--hair);
  border-radius:var(--r-md); margin-bottom:16px; overflow:hidden}
.ribbon .cell{flex:1; min-width:150px; padding:11px 16px; border-right:1px solid var(--hair)}
.ribbon .cell:last-child{border-right:none}
.ribbon .lb{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.ribbon .vl{font-family:var(--mono); font-size:16.5px; font-weight:700; margin-top:2px}

/* toolbar */
.toolbar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:11px 14px; background:var(--card);
  border:1px solid var(--hair); border-bottom:none; border-radius:var(--r-md) var(--r-md) 0 0}
.toolbar.solo{border-bottom:1px solid var(--hair); border-radius:var(--r-md); margin-bottom:14px}
.search{display:flex; align-items:center; gap:7px; background:var(--elev); border:1px solid var(--hair);
  border-radius:var(--r-sm); padding:6px 10px; min-width:210px; color:var(--muted); font-size:12.5px}
.search input{background:none; border:none; outline:none; width:100%; font-size:12.5px; color:var(--text)}
.chipset{display:flex; gap:6px; flex-wrap:wrap}
.chip{padding:5px 11px; border-radius:99px; border:1px solid var(--hair); font-size:11.5px; font-weight:600;
  color:var(--text2); display:flex; align-items:center; gap:6px}
.chip:hover{border-color:var(--hair-active); color:var(--text)}
.chip.on{background:var(--elev); border-color:var(--primary); color:var(--text); font-weight:700}
.chip .pip{width:7px;height:7px;border-radius:99px;background:var(--info)}
.pillbar{display:flex; gap:3px; background:var(--elev); border-radius:var(--r-sm); padding:3px; border:1px solid var(--hair)}
.pillbar button{padding:5px 11px; border-radius:4px; font-size:11.5px; font-weight:600; color:var(--muted)}
.pillbar button.on{background:var(--card); color:var(--text); font-weight:700; box-shadow:0 1px 0 var(--hair)}

/* table */
.tablewrap{border:1px solid var(--hair); border-radius:0 0 var(--r-md) var(--r-md); overflow:auto; background:var(--card);
  max-height:calc(100vh - 350px)}
.tablewrap.solo{border-radius:var(--r-md)}
table{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
thead th{position:sticky; top:0; z-index:3; background:var(--elev); color:var(--muted);
  font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; text-align:left;
  padding:9px 12px; border-bottom:1px solid var(--hair); white-space:nowrap}
thead tr:nth-child(2) th{top:31px}
thead th.c{text-align:center} thead th.r{text-align:right}
tbody td{padding:8px 12px; border-bottom:1px solid var(--hair); color:var(--text2); vertical-align:middle}
tbody tr:hover td{background:var(--zebra)}
tbody tr:last-child td{border-bottom:none}
td.c{text-align:center} td.r{text-align:right}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; color:var(--text)}
td.strong{color:var(--text); font-weight:600}
td.trunc{max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
tfoot td{padding:9px 12px; background:var(--elev); font-weight:700; color:var(--text); border-top:1px solid var(--hair)}
.grp td{background:var(--elev); font-weight:700; color:var(--text); font-size:11.5px;
  letter-spacing:.03em; text-transform:uppercase}

/* badges */
.bd{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px;
  font-size:10.5px; font-weight:700; letter-spacing:.02em; white-space:nowrap}
.bd-ok{background:var(--success-bg); color:var(--success)}
.bd-bad{background:var(--danger-bg); color:var(--danger)}
.bd-warn{background:var(--warning-bg); color:var(--primary)}
.bd-info{background:var(--info-bg); color:var(--info)}
.bd-pur{background:var(--purple-bg); color:var(--purple)}
:root[data-theme="light"] .bd-ok{background:rgba(29,158,117,.12)}
:root[data-theme="light"] .bd-bad{background:rgba(226,75,74,.12)}
:root[data-theme="light"] .bd-warn{background:rgba(239,159,39,.16); color:var(--warning)}
:root[data-theme="light"] .bd-info{background:rgba(55,138,221,.13)}
:root[data-theme="light"] .bd-pur{background:rgba(124,92,252,.13)}

/* progress */
.bar{height:5px; border-radius:99px; background:var(--elev); overflow:hidden; min-width:54px}
.bar i{display:block; height:100%; border-radius:99px; background:var(--primary)}
.bar.ok i{background:var(--success)} .bar.bad i{background:var(--danger)} .bar.warn i{background:var(--warning)}

/* charts */
.barchart{display:flex; flex-direction:column; gap:9px}
.barrow{display:grid; grid-template-columns:112px 1fr 108px; align-items:center; gap:11px; font-size:11.5px}
.barrow .nm{color:var(--text2); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barrow .tk{height:8px; background:var(--elev); border-radius:99px; overflow:hidden}
.barrow .tk i{display:block; height:100%; border-radius:99px}
.barrow .vl{font-family:var(--mono); text-align:right; color:var(--text); font-weight:600; font-size:11px}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; padding-top:13px; border-top:1px solid var(--hair)}
.legend span{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text2); font-weight:600}
.legend i{width:9px;height:9px;border-radius:3px}

/* month grid (heat) */
.mgrid{display:grid; grid-template-columns:repeat(12,1fr); gap:4px}
.mcell{border-radius:var(--r-sm); border:1px solid var(--hair); padding:7px 4px; text-align:center; min-width:0}
.mcell .m{font-size:9.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.mcell .v{font-family:var(--mono); font-size:11.5px; font-weight:700; margin-top:3px; color:var(--text)}
.spark{display:flex; align-items:flex-end; gap:3px; height:52px}
.spark i{flex:1; background:var(--primary); border-radius:2px 2px 0 0; min-height:2px; opacity:.85}
.spark i.t{background:var(--elev)}

/* split view (Konsep C) */
.split{display:flex; gap:14px; align-items:stretch; min-height:0; height:calc(100vh - 268px)}
.split .lst{width:322px; flex-shrink:0; background:var(--card); border:1px solid var(--hair);
  border-radius:var(--r-md); display:flex; flex-direction:column; overflow:hidden}
.split .lst .lh{padding:11px 13px; border-bottom:1px solid var(--hair)}
.split .lst .ls{flex:1; overflow-y:auto}
.lrow{padding:10px 13px; border-bottom:1px solid var(--hair); border-left:3px solid transparent; text-align:left; width:100%; display:block}
.lrow:hover{background:var(--zebra)}
.lrow.on{background:var(--elev); border-left-color:var(--primary)}
.lrow .t1{font-size:12.5px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lrow .t2{font-size:11px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:7px}
.lrow .t2 .num{font-family:var(--mono); color:var(--text2); font-weight:600}
.split .insp{flex:1; min-width:0; background:var(--card); border:1px solid var(--hair);
  border-radius:var(--r-md); display:flex; flex-direction:column; overflow:hidden}
.split .insp .ib{flex:1; overflow-y:auto; padding:16px}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:16px}
.kv .k{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.kv .v{font-size:13px; font-weight:600; color:var(--text); margin-top:3px}
.kv .v.num{font-family:var(--mono)}
.sect{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  margin:18px 0 9px; padding-bottom:7px; border-bottom:1px solid var(--hair)}
.sect:first-child{margin-top:0}

/* hero indikator */
.hero{display:grid; grid-template-columns:1fr 232px; gap:16px; margin-bottom:16px}
@media(max-width:1100px){.hero{grid-template-columns:1fr}}

function raRows(level, n){
  const out = [];
  for(let i=0;i<n;i++){
    const tgt = rint(60,100);
    const real = Math.min(120, tgt - rint(-14,26));
    const bulan = Array.from({length:12}, () => rint(0, Math.round(real/8)));
    out.push({
      no:i+1,
      tujuan: TUJUAN[i%2], sasaran: SASARAN[i%2],
      program: PROGRAM[i%4], kegiatan: KEGIATAN[i%4], sub: SUBKEG[i%4],
      indikator: INDIKATOR[i%INDIKATOR.length],
      satuan: SATUAN[i%SATUAN.length], jenis: JENIS[i%4],
      rpjmd: tgt+rint(2,10), tahunan: tgt, real,
      pct: Math.round(real/tgt*10000)/100,
      anggaran: rint(120,980)*1e6,
      bulan,
      tw:[1,2,3,4].map(q => ({t:Math.round(tgt/4), r:Math.round(real/4)+rint(-4,5)})),
    });
  }
  return out;
}
function sskRows(sumber, n){
  const out=[];
  for(let i=0;i<n;i++){
    const pagu = rint(80,1400)*1e6;
    const bulan = Array.from({length:12}, () => 0);
    let sisa = pagu;
    for(let m=0;m<12;m++){ const v = m===11 ? sisa : Math.round(rnd()*sisa*0.22); bulan[m]=v; sisa-=v; }
    const total = bulan.reduce((a,b)=>a+b,0);
    out.push({
      no:i+1, program:PROGRAM[i%4], kegiatan:KEGIATAN[i%4], sub:SUBKEG[i%4],
      uraian:URAIANSSK[i%URAIANSSK.length], rek:REKENING[i%REKENING.length],
      sumber, pagu, bulan, total, pctTotal: Math.round(total/pagu*10000)/100,
    });
  }
  return out;
}
function realRows(sumber, n){
  const out=[];
  for(let i=0;i<n;i++){
    const pagu = rint(80,1400)*1e6;
    const tf = rint(5,12), rf = tf + rint(-3,3);
    const rk = Math.round(pagu*(rint(4,11)/100));
    out.push({
      no:i+1, ket:SUBKEG[i%4], uraian:URAIANSSK[i%URAIANSSK.length], sumber, pagu,
      tf, rf, pctF: Math.round(rf/tf*10000)/100,
      akT: tf*rint(3,7), akR: rf*rint(3,7),
      rk, pctK: Math.round(rk/pagu*10000)/100,
      akK: rk*rint(3,7),
      dev: rf-tf,
    });
  }
  return out;
}

  return `<div class="ribbon">${cells.map(c=>`<div class="cell"><div class="lb">${c[0]}</div><div class="vl">${c[1]}</div></div>`).join('')}</div>`;
}
function yearSelect(){
  return `<select>${[2024,2025,2026,2027].map(y=>`<option ${y===2026?'selected':''}>Tahun ${y}</option>`).join('')}</select>`;
}
function searchBox(ph){ return `<div class="search">${ico('search',14)}<input placeholder="${ph}"></div>`; }

function monthGrid(vals, fmt){
  const mx = Math.max(...vals, 1);
  return `<div class="mgrid">${vals.map((v,i)=>{
    const a = v/mx;
    return `<div class="mcell" style="background:${a>0.02?`color-mix(in srgb, var(--primary) ${Math.round(a*38)}%, transparent)`:'transparent'}">
      <div class="m">${BULAN[i]}</div><div class="v">${fmt?fmt(v):v}</div></div>`;
  }).join('')}</div>`;
}
function sparkOf(vals){
  const mx = Math.max(...vals,1);
  return `<div class="spark">${vals.map(v=>`<i style="height:${Math.max(4,v/mx*100)}%"></i>`).join('')}</div>`;
}
function barChart(rows){
  const mx = Math.max(...rows.map(r=>r[1]),1);
  return `<div class="barchart">${rows.map((r,i)=>`
    <div class="barrow"><div class="nm">${r[0]}</div>
      <div class="tk"><i style="width:${r[1]/mx*100}%;background:${VIZ[i%VIZ.length]}"></i></div>
      <div class="vl">${r[2]}</div></div>`).join('')}</div>`;
}
function donut(rows){
  const tot = rows.reduce((a,r)=>a+r[1],0) || 1;
  let acc = 0; const R=54, C=2*Math.PI*R;
  const segs = rows.map((r,i)=>{
    const len = r[1]/tot*C, off = -acc; acc += len;
    return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${VIZ[i%VIZ.length]}" stroke-width="19"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg width="140" height="140" viewBox="0 0 140 140">${segs}
      <text x="70" y="66" text-anchor="middle" font-family="var(--mono)" font-size="17" font-weight="700" fill="currentColor">${RP(tot/1e9)}</text>
      <text x="70" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--muted)" letter-spacing="1">MILIAR RP</text>
    </svg>
    <div style="flex:1;min-width:150px">
      ${rows.map((r,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0">
        <i style="width:9px;height:9px;border-radius:3px;background:${VIZ[i%VIZ.length]};flex-shrink:0"></i>
        <span style="color:var(--text2);font-weight:600">${r[0]}</span>
        <span class="mono" style="margin-left:auto;color:var(--text);font-weight:600">${PC(r[1]/tot*100)}</span></div>`).join('')}
    </div></div>`;
}

/* tabel generik: cols = [{h, cls, w, sub:[..]}] */
function tableOf(cols, rows, opts){
  opts = opts || {};
  const hasSub = cols.some(c => c.sub);
  const head = hasSub
    ? `<tr>${cols.map(c => c.sub
        ? `<th class="c" colspan="${c.sub.length}" style="border-left:1px solid var(--hair)">${c.h}</th>`
        : `<th rowspan="2" class="${c.cls||''}" ${c.w?`style="width:${c.w}"`:''}>${c.h}</th>`).join('')}</tr>
       <tr>${cols.filter(c=>c.sub).flatMap(c => c.sub.map((s,i) =>
        `<th class="c" ${i===0?'style="border-left:1px solid var(--hair)"':''}>${s}</th>`)).join('')}</tr>`
    : `<tr>${cols.map(c => `<th class="${c.cls||''}" ${c.w?`style="width:${c.w}"`:''}>${c.h}</th>`).join('')}</tr>`;
  return `<div class="tablewrap ${opts.solo?'solo':''}"><table>
    <thead>${head}</thead><tbody>${rows.join('')}</tbody>
    ${opts.foot?`<tfoot>${opts.foot}</tfoot>`:''}</table></div>`;
}

/* ── Kinerja · Pendapatan & CRR ── */
function scrKCrr(){
  let pd=0, bb=0, bd=0;
  const pend = BULAN_FULL.map((b,i)=>{
    const t = rint(1200,2400)*1e6, r = Math.round(t*(rint(70,118)/100));
    return {no:i+1, bulan:b, target:t, real:r, pct:Math.round(r/t*10000)/100};
  });
  const crr = BULAN_FULL.map((b,i)=>{
    const p = pend[i].real, x = Math.round(p*(rint(58,88)/100)), y = Math.round(p*(rint(12,30)/100));
    pd+=p; bb+=x; bd+=y;
    return {no:i+1, bulan:b, pend:p, bblud:x, bdaerah:y, pdSd:pd, bbSd:bb, bdSd:bd,
      parsial: Math.round(p/Math.max(x,1)*10000)/100, total: Math.round(pd/Math.max(bb+bd,1)*10000)/100};
  });
  const totT = pend.reduce((a,r)=>a+r.target,0), totR = pend.reduce((a,r)=>a+r.real,0);
  const cards = [
    kpi('Target Pendapatan','Rp '+RP(totT/1e6)+' jt','Tahun 2026','wallet','#378ADD'),
    kpi('Realisasi','Rp '+RP(totR/1e6)+' jt','Diterima','coins','#1D9E75'),
    kpi('Capaian',PC(totR/totT*100),'Terhadap target','percent','#EF9F27'),
    kpi('CRR Total',PC(crr[11].total),'Cost Recovery Rate','trend','#7C5CFC'),
  ].join('');

  const c1=[{h:'No',cls:'c',w:'42px'},{h:'Bulan'},{h:'Target (Rp)',cls:'r'},{h:'Realisasi (Rp)',cls:'r'},{h:'Capaian %',cls:'c',w:'160px'}];
  const r1=pend.map(r=>`<tr><td class="c muted mono">${r.no}</td><td class="strong">${r.bulan}</td>
    <td class="num">${RP(r.target)}</td><td class="num">${RP(r.real)}</td>
    <td class="c"><div style="display:flex;align-items:center;gap:9px">${barOf(r.pct,r.pct>=100?'ok':r.pct>=85?'warn':'bad')}<span class="mono" style="font-size:11px">${PC(r.pct)}</span></div></td></tr>`);
  const f1=`<tr><td colspan="2">TOTAL</td><td class="num">${RP(totT)}</td><td class="num">${RP(totR)}</td><td class="c mono">${PC(totR/totT*100)}</td></tr>`;

  const c2=[{h:'No',cls:'c',w:'42px'},{h:'Bulan'},{h:'Pendapatan',cls:'r'},{h:'Belanja BLUD',cls:'r'},{h:'Belanja Daerah',cls:'r'},
            {h:'Pend. s/d',cls:'r'},{h:'BLUD s/d',cls:'r'},{h:'Daerah s/d',cls:'r'},{h:'CRR Parsial',cls:'c'},{h:'CRR Total',cls:'c'}];
  const r2=crr.map(r=>`<tr><td class="c muted mono">${r.no}</td><td class="strong">${r.bulan}</td>
    <td class="num">${RP(r.pend/1e6)}</td><td class="num">${RP(r.bblud/1e6)}</td><td class="num">${RP(r.bdaerah/1e6)}</td>
    <td class="num">${RP(r.pdSd/1e6)}</td><td class="num">${RP(r.bbSd/1e6)}</td><td class="num">${RP(r.bdSd/1e6)}</td>
    <td class="c">${pctBadge(r.parsial)}</td><td class="c">${pctBadge(r.total)}</td></tr>`);

  return {
    body:`<div class="kpigrid">${cards}</div>
      <div class="toolbar solo">${yearSelect()}
        <div class="pillbar"><button class="on">Pendapatan</button><button>CRR</button><button>Belanja Otomatis</button></div>
        <div style="margin-left:auto;display:flex;gap:8px">${btn('ghost','Import','upload','sm')}${btn('success','Excel','download','sm')}${btn('primary','Simpan','save','sm')}</div></div>
      <div class="card-h" style="border:none;padding:2px 0 10px"><h3>Pendapatan — Target vs Realisasi</h3></div>
      ${tableOf(c1,r1,{solo:true,foot:f1})}
      <div class="card-h" style="border:none;padding:18px 0 10px"><h3>Cost Recovery Rate (CRR)</h3><span class="sub">nilai dalam juta rupiah</span></div>
      ${tableOf(c2,r2,{solo:true})}`,
    rows: pend, cols:c1,
    listOf: r => ({t1:r.bulan, t2:`Target Rp ${RP(r.target/1e6)} jt`, badge:pctBadge(r.pct)}),
    inspect: r => `<div class="sect">Pendapatan — ${r.bulan} 2026</div>
      <div class="kv">
        <div><div class="k">Target</div><div class="v num">Rp ${RP(r.target)}</div></div>
        <div><div class="k">Realisasi</div><div class="v num">Rp ${RP(r.real)}</div></div>
        <div><div class="k">Capaian</div><div class="v num">${PC(r.pct)}</div></div>
      </div>
      <div class="sect">CRR Bulan Ini</div>
      <div class="kv">
        <div><div class="k">Belanja BLUD</div><div class="v num">Rp ${RP(crr[r.no-1].bblud)}</div></div>
        <div><div class="k">Belanja Daerah</div><div class="v num">Rp ${RP(crr[r.no-1].bdaerah)}</div></div>
        <div><div class="k">CRR Parsial</div><div class="v num">${PC(crr[r.no-1].parsial)}</div></div>
        <div><div class="k">CRR Total (s/d)</div><div class="v num">${PC(crr[r.no-1].total)}</div></div>
      </div>
      <div class="sect">Realisasi Pendapatan 12 Bulan (Rp juta)</div>
      ${monthGrid(pend.map(x=>Math.round(x.real/1e6)), v=>v)}`,
    ribbon:[['Target','Rp '+RP(totT/1e6)+' jt'],['Realisasi','Rp '+RP(totR/1e6)+' jt'],
            ['Capaian',PC(totR/totT*100)],['CRR Total',PC(crr[11].total)]],
  };
}

/* ── Kinerja · Pengaturan ── */
function scrKSet(){
  const sw = (t,d,on,v)=>`<div class="card"><div class="card-b" style="display:flex;gap:14px;align-items:flex-start">
    <div style="flex:1"><div style="font-size:13.5px;font-weight:700">${t}</div>
      <div class="hint" style="margin-top:4px">${d}</div></div>
    <div style="flex-shrink:0">${on?badge('ok','AKTIF'):badge('bad','NONAKTIF')}</div>
    <div style="flex-shrink:0">${btn(v,on?'Matikan':'Nyalakan','settings','sm')}</div></div></div>`;
  return {body:`
    <div class="card" style="margin-bottom:14px;border-color:var(--danger)">
      <div class="card-b" style="display:flex;gap:12px;align-items:center">
        ${ico('lock',18)}<div><b style="font-size:13px">Area SUPER_ADMIN</b>
        <div class="hint">Perubahan di halaman ini berlaku sistem-wide dan tercatat di audit log.</div></div></div></div>
    <div class="stack">
      ${sw('Kill-switch Modul E-Anggaran','Menutup seluruh endpoint <span class="mono">/api/kinerja/*</span> secara fail-closed. Dipakai saat migrasi data atau insiden.',true,'danger')}
      ${sw('Kunci Versi RKO 2026','Mengunci versi MURNI agar tidak bisa diedit. Perubahan wajib lewat versi PERUBAHAN.',true,'warning')}
      ${sw('Impor Realisasi dari Excel','Mengizinkan unggah berkas realisasi massal oleh ADMIN.',false,'success')}
      <div class="card"><div class="card-h"><h3>Reset Tahun Anggaran</h3></div>
        <div class="card-b">
          <div class="hint" style="margin-bottom:12px">Menghapus seluruh RKO, realisasi, dan pendapatan pada tahun terpilih. Master rekening tidak ikut terhapus. Tindakan ini tidak dapat dibatalkan.</div>
          <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
            <div class="field" style="min-width:180px"><label>Tahun anggaran</label>${yearSelect()}</div>
            <div class="field" style="min-width:220px"><label>Ketik <span class="mono">RESET</span> untuk konfirmasi</label><input placeholder="RESET"></div>
            ${btn('danger','Reset Tahun Anggaran','x')}
          </div></div></div>
    </div>`};
}

/* ═════════════════════════ Router layar ═════════════════════════ */
function buildScreen(){
  const it = findItem(S.module, S.item);
  _s = 20260811 + it.id.length*77;   // seed stabil per layar
  let s;
  switch(it.kind){
    case 'ra-entry':   s = scrRaEntry(it); break;
    case 'ra-dash':    s = scrRaDash(it); break;
    case 'ra-cetak':   s = scrRaCetak(); break;
    case 'k-beranda':  s = scrKBeranda(); break;
    case 'k-laporan':  s = scrKLaporan(); break;
    case 'k-master':   s = scrKMaster(); break;
    case 'k-rekening': s = scrKRekening(); break;
    case 'k-rko':      s = scrKRko(it); break;
    case 'k-real':     s = scrKReal(it); break;
    case 'k-cetak':    s = scrKCetak(); break;
    case 'k-crr':      s = scrKCrr(); break;
    default:           s = scrKSet(); break;
  }
  s.item = it;
  return s;
}

/* ═════════════════════════ Aksi halaman per layar ═════════════════════════ */
function pageActions(it){
  const map = {
    'ra-entry':  [btn('ghost','Duplikasi Tahun','copy','sm'), btn('warning','Kunci Periode','lock','sm')],
    'ra-dash':   [btn('ghost','Matriks Bulanan','grid','sm'), btn('success','Excel','download','sm')],
    'ra-cetak':  [],
    'k-beranda': [btn('ghost','Muat Ulang','trend','sm')],
    'k-laporan': [btn('ghost','Excel','download','sm')],
    'k-master':  [btn('ghost','Sinkron dari Renaksi','copy','sm')],
    'k-rekening':[btn('ghost','Excel','download','sm')],
    'k-rko':     [btn('ghost','Riwayat Versi','clip','sm')],
    'k-real':    [btn('ghost','Nomenklatur','book','sm')],
    'k-cetak':   [],
    'k-crr':     [btn('ghost','Belanja Otomatis','coins','sm')],
    'k-set':     [],
  };
  return (map[it.kind]||[]).join('');
}

/* ═════════════════════════ Shell per konsep ═════════════════════════ */

function navGroupsA(mod){
  return MODULES[mod].groups.map(g => {
    const open = S.openGroup[mod] === g.id || g.items.length === 1;
    const single = g.items.length === 1;
    if(single){
      const it = g.items[0];
      return `<button class="navitem ${S.item===it.id?'on':''}" onclick="go('${it.id}')">${ico(it.icon,16)}<span>${it.label}</span></button>`;
    }
    return `<div>
      <button class="navitem" onclick="toggleGroup('${g.id}')">${ico(g.icon,16)}<span>${g.label}</span>
        <span class="tail">${g.items.length}</span>
        <span style="transition:.2s;transform:rotate(${open?0:-90}deg);display:flex;color:var(--muted)">${ico('chevron',14)}</span></button>
      ${open?`<div class="navsub">${g.items.map(it=>`
        <button class="navitem ${S.item===it.id?'on':''}" onclick="go('${it.id}')">
          <span class="pip" style="color:${it.accent}"></span><span>${it.label}</span></button>`).join('')}</div>`:''}
    </div>`;
  }).join('');
}

function shellA(scr){
  const M = MODULES[S.module];
  return `<div class="app">
    <aside class="sb">
      <div class="sb-head">
        <div class="sb-logo">${ico(M.icon,17)}</div>
        <div style="min-width:0"><div class="sb-title">${M.full}</div><div class="sb-sub">${M.sub}</div></div>
      </div>
      <div class="sb-year">${yearSelect()}</div>
      <div class="sb-nav">
        <div class="sb-lbl">Menu Utama</div>
        ${navGroupsA(S.module)}
      </div>
      <div class="sb-foot">PRIMA v1.0 · ${M.name}</div>
    </aside>
    <div class="main">
      <div class="pagehead">
        <div><h1>${scr.item.title}</h1><p>${scr.item.desc}</p></div>
        <div class="acts">${pageActions(scr.item)}</div>
      </div>
      <div class="body">${scr.body}</div>
    </div></div>`;
}

function shellB(scr){
  const M = MODULES[S.module];
  const grp = MODULES[S.module].groups.find(g => g.items.some(i=>i.id===S.item)) || MODULES[S.module].groups[0];
  const railBtn = (m) => `<button class="${S.module===m?'on':''}" onclick="setModule('${m}')" title="${MODULES[m].name}">${ico(MODULES[m].icon,19)}</button>`;
  const ctxItems = grp.items.map(it => `
    <button class="navitem ${S.item===it.id?'on':''}" onclick="go('${it.id}')">
      <span class="pip" style="color:${it.accent}"></span><span>${it.label}</span></button>`).join('');
  const railGroups = MODULES[S.module].groups.map(g =>
    `<button class="${g.id===grp.id?'on':''}" onclick="go('${g.items[0].id}')" title="${g.label}">${ico(g.icon,17)}</button>`).join('');

  return `<div class="app">
    <div class="rail">
      <div class="rlogo">${ico('target',18)}</div>
      ${railBtn('renaksi')}${railBtn('kinerja')}
      <div class="rsep"></div>
      ${railGroups}
    </div>
    <div class="ctxpanel">
      <div class="ch"><h3>${grp.label}</h3><p>${M.full}</p></div>
      <div class="sb-year">${yearSelect()}</div>
      <div class="sb-nav">${ctxItems}</div>
      <div class="sb-foot">${grp.items.length} menu · v1.0</div>
    </div>
    <div class="main">
      <div class="cmdbar">
        <div class="crumb">${ico(M.icon,14)}<span>${M.name}</span>${ico('chevron',12)}<span>${grp.label}</span>${ico('chevron',12)}<b>${scr.item.label}</b></div>
        <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
          <div class="cmdk">${ico('search',13)}<span>Cari menu, indikator, rekening…</span><kbd>Ctrl K</kbd></div>
          ${pageActions(scr.item)}
        </div>
      </div>
      <div class="pagehead" style="padding-bottom:8px">
        <div><h1>${scr.item.title}</h1><p>${scr.item.desc}</p></div>
      </div>
      <div class="body">
        <div style="display:flex;gap:2px;margin-bottom:14px;overflow-x:auto;border-bottom:1px solid var(--hair)">
          ${grp.items.map(it=>`<button onclick="go('${it.id}')" style="padding:8px 13px;font-size:12.5px;font-weight:${S.item===it.id?700:600};
            color:${S.item===it.id?'var(--primary)':'var(--text2)'};border-bottom:2px solid ${S.item===it.id?'var(--primary)':'transparent'};white-space:nowrap">${it.label}</button>`).join('')}
        </div>
        ${scr.body}
      </div>
    </div></div>`;
}

function shellC(scr){
  const M = MODULES[S.module];
  const grp = MODULES[S.module].groups.find(g => g.items.some(i=>i.id===S.item)) || MODULES[S.module].groups[0];
  const nav = `<div class="topnav">
    <div class="row1">
      <div class="modtab">
        ${Object.values(MODULES).map(m=>`<button class="${S.module===m.key?'on':''}" onclick="setModule('${m.key}')">${ico(m.icon,15)}${m.name}</button>`).join('')}
      </div>
      <div style="width:150px">${yearSelect()}</div>
      <div class="crumb" style="margin-left:6px">${grp.label}${ico('chevron',12)}<b>${scr.item.label}</b></div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <div class="cmdk" style="min-width:190px">${ico('search',13)}<span>Cari…</span><kbd>Ctrl K</kbd></div>
        ${pageActions(scr.item)}
      </div>
    </div>
    <div class="row2">
      ${MODULES[S.module].groups.flatMap(g => g.items).map(it =>
        `<button class="${S.item===it.id?'on':''}" onclick="go('${it.id}')">${it.label}</button>`).join('')}
    </div></div>`;

  let content;
  if(scr.rows && scr.listOf && scr.inspect){
    const sel = S.sel % scr.rows.length;
    const r = scr.rows[sel];
    const info = scr.listOf(r);
    content = (scr.ribbon?ribbonOf(scr.ribbon):'') + `<div class="split">
      <div class="lst">
        <div class="lh">${searchBox('Cari…')}</div>
        <div class="ls">${scr.rows.map((x,i)=>{const o=scr.listOf(x);
          return `<button class="lrow ${i===sel?'on':''}" onclick="setSel(${i})">
            <div class="t1">${o.t1}</div><div class="t2"><span>${o.t2}</span><span style="margin-left:auto">${o.badge||''}</span></div></button>`;}).join('')}</div>
        <div style="padding:10px 12px;border-top:1px solid var(--hair);display:flex;gap:7px">
          ${btn('purple','Tambah','plus','sm')}${btn('ghost','Excel','download','sm')}</div>
      </div>
      <div class="insp">
        <div class="card-h"><h3>${info.t1}</h3><span class="sub">${info.t2}</span>
          <div class="acts">${btn('ghost','Duplikat','copy','sm')}${btn('danger','Hapus','x','sm')}</div></div>
        <div class="ib">${scr.inspect(r)}</div>
      </div></div>`;
  } else {
    content = scr.body;
  }

  return `<div style="display:flex;flex-direction:column;flex:1;min-height:0">
    ${nav}
    <div class="main">
      <div class="pagehead" style="padding-bottom:10px"><div><h1>${scr.item.title}</h1><p>${scr.item.desc}</p></div></div>
      <div class="body">${content}</div>
    </div></div>`;
}

/* ═════════════════════════ Render ═════════════════════════ */
function render(){
  document.documentElement.dataset.concept = S.concept;
  document.documentElement.dataset.theme   = S.theme;

  const n = NOTES[S.concept];
  document.getElementById('notes').innerHTML = S.notesOpen
    ? `<span class="tag">${n.tag}</span><b style="flex-shrink:0">${n.name}</b><span>${n.text}</span>
       <button class="close" onclick="S.notesOpen=false;render()">${ico('x',15)}</button>`
    : `<span class="tag">${n.tag}</span><b>${n.name}</b>
       <button class="close" onclick="S.notesOpen=true;render()" style="margin-left:auto;font-size:11px;font-weight:700">Tampilkan catatan konsep</button>`;

  const scr = buildScreen();
  const stage = document.getElementById('stage');
  stage.innerHTML = S.concept==='a' ? shellA(scr) : S.concept==='b' ? shellB(scr) : shellC(scr);

  document.querySelectorAll('#conceptSeg button').forEach(b => b.classList.toggle('on', b.dataset.c===S.concept));
  document.querySelectorAll('#moduleSeg button').forEach(b => b.classList.toggle('on', b.dataset.m===S.module));
  document.getElementById('themeBtn').innerHTML = ico(S.theme==='dark'?'sun':'moon',16);
  const tot = allItems('renaksi').length + allItems('kinerja').length;
  document.getElementById('menuCount').textContent =
    `${allItems(S.module).length} menu di modul ini · ${tot} menu total`;
}

/* ═════════════════════════ Aksi ═════════════════════════ */
function go(id){ S.item = id; S.sel = 0;
  const g = MODULES[S.module].groups.find(x=>x.items.some(i=>i.id===id));
  if(g) S.openGroup[S.module] = g.id;
  render(); }
function toggleGroup(g){ S.openGroup[S.module] = S.openGroup[S.module]===g ? null : g; render(); }
function setModule(m){ S.module = m; S.item = allItems(m)[0].id; S.sel = 0;
  S.openGroup[m] = MODULES[m].groups[0].id; render(); }
function setSel(i){ S.sel = i; render(); }
function setMonthMode(m){ S.monthMode = m; render(); }

document.getElementById('conceptSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; S.concept = b.dataset.c; S.sel = 0; render(); });
document.getElementById('moduleSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; setModule(b.dataset.m); });
document.getElementById('themeBtn').addEventListener('click', () => {
  S.theme = S.theme==='dark' ? 'light' : 'dark'; render(); });

render();
</script>
