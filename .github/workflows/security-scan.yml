# ─── PRIMA — SAST CI Gate (Security Scan) ────────────────────────────────────
# SDL-Audit v1.1 — ISO 27001 A.8.8 (Vulnerability Management).
#
# Jalan otomatis di 3 trigger:
#   1. Push ke branch utama (mysql / main) — gate sebelum merge
#   2. PR ke branch utama — block merge kalau finding HIGH
#   3. Schedule mingguan (Senin 02:00 UTC) — scan CVE baru di dep
#
# 4 job paralel:
#   A. semgrep — SAST scan kode (OWASP Top 10, React, TypeScript, security-audit rules)
#   B. npm-audit — Dependency CVE check (block kalau ada HIGH baru)
#   C. quality-gate — `npx tsc --noEmit` + `npm run lint` + `npm run rima:check` (NLU gate)
#   D. gitleaks — Secret scanning (JWT_SECRET / password DB / API key ter-commit) — config .gitleaks.toml
#
# Setup tambahan (opsional, tidak wajib untuk MVP):
#   - SEMGREP_APP_TOKEN di GitHub Secrets → enable Semgrep Cloud dashboard
#   - Tanpa token, tetap jalan dengan output console saja
name: Security Scan
on:
  push:
    branches: [mysql, main]
  pull_request:
    branches: [mysql, main]
  schedule:
    # Senin 02:00 UTC (= 09:00 WIB) — weekly dependency scan
    - cron: '0 2 * * 1'

permissions:
  contents: read
  pull-requests: write   # untuk comment finding di PR (opsional)
  security-events: write # untuk upload SARIF ke GitHub Security tab

jobs:
  # ─── JOB A: Semgrep SAST scan ──────────────────────────────────────────────
  # Pakai `semgrep scan` (tidak butuh cloud token) bukan `semgrep ci`.
  # SARIF upload skip — Code Scanning butuh GitHub Advanced Security (org/enterprise paid),
  # tidak available di repo private user-account.
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep scan (OWASP + React + TS + Security Audit)
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/react \
            --config=p/javascript \
            --config=p/nodejs \
            --config=p/jwt \
            --config=p/sql-injection \
            --config=p/xss \
            --exclude="_archive/" \
            --exclude="graphify-out/" \
            --exclude=".next/" \
            --exclude="docs/migrations/" \
            --exclude="node_modules/" \
            --severity=ERROR \
            --error \
            --metrics=off
        # --error: exit 1 kalau ada finding (block merge)
        # --metrics=off: opt-out telemetry
        # Output ke stdout, terlihat langsung di Actions log

  # ─── JOB B: NPM Audit (dependency CVE check) ───────────────────────────────
  npm-audit:
    name: NPM Audit (Dependency CVE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (deterministic via lockfile)
        run: npm ci

      - name: Audit production dependencies
        run: |
          echo "=== Production dependencies CVE check (HIGH/CRITICAL) ==="
          # Block kalau ada CVE HIGH/CRITICAL baru DI LUAR allowlist.
          # Allowlist advisory yang sudah di-review (false-positive / unfixable-aman):
          #   GHSA-mh99-v99m-4gvg (brace-expansion DoS) — npm audit meng-collapse range
          #   multi-branch jadi "<=5.0.7", salah tandai versi maintenance PATCHED 1.1.16 /
          #   2.1.2 (patched di 1.1.12 / 2.0.2). Satu-satunya versi >5.0.7 (5.0.8) ESM-only
          #   → memecah require CJS di rantai exceljs/archiver/googleapis saat runtime.
          #   Production tetap pakai versi patched. Advisory baru lain tetap mem-block.
          ALLOW="GHSA-mh99-v99m-4gvg"
          AUDIT=$(npm audit --omit=dev --audit-level=high --json || true)
          BLOCK=$(echo "$AUDIT" | jq -r --arg allow "$ALLOW" '
            [ .vulnerabilities[]?
              | select(.severity=="high" or .severity=="critical")
              | .via[]? | objects | .url // empty ]
            | unique | map(select(test($allow) | not)) | .[]')
          if [ -n "$BLOCK" ]; then
            echo "::error::npm audit menemukan CVE HIGH/CRITICAL baru (di luar allowlist):"
            echo "$BLOCK"
            npm audit --omit=dev --audit-level=high || true
            exit 1
          fi
          echo "OK — hanya advisory allowlist (brace-expansion false-positive) yang tersisa."

      - name: Guard brace-expansion — allowlist sadar-versi (tutup celah)
        run: |
          echo "=== Guard: verifikasi versi brace-expansion terpasang BUKAN yang rentan ==="
          # Allowlist di step atas sengaja membungkam false-positive npm audit (range asli
          # GHSA-mh99-v99m-4gvg di-collapse jadi "<=5.0.7", ikut menandai versi maintenance
          # PATCHED 1.1.16 / 2.1.2). Guard ini menutup celah allowlist-by-ID: baca versi
          # brace-expansion yang BENAR-BENAR terpasang di production, dan gagalkan build kalau
          # ada yang jatuh di rentang RENTAN asli advisory:
          #   <1.1.12 | >=2.0.0 <2.0.2 | =3.0.0 | =4.0.0 | >=5.0.0 <5.0.8
          # Jadi kalau suatu saat dependency baru menarik mis. 5.0.7, CI tetap menangkapnya.
          npm ls brace-expansion --all --omit=dev --json > be.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const tree = JSON.parse(fs.readFileSync("be.json", "utf8") || "{}");
            const found = new Set();
            const walk = (deps) => {
              if (!deps) return;
              for (const [name, node] of Object.entries(deps)) {
                if (name === "brace-expansion" && node && node.version) found.add(node.version);
                if (node && node.dependencies) walk(node.dependencies);
              }
            };
            walk(tree.dependencies);
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0); }
              return 0;
            };
            const vulnerable = (v) => {
              const maj = Number(v.split(".")[0]);
              if (maj === 1) return cmp(v, "1.1.12") < 0;
              if (maj === 2) return cmp(v, "2.0.2") < 0;
              if (maj === 3) return cmp(v, "3.0.1") < 0;
              if (maj === 4) return cmp(v, "4.0.1") < 0;
              if (maj === 5) return cmp(v, "5.0.8") < 0;
              return false;
            };
            const bad = [...found].filter(vulnerable);
            if (bad.length) {
              console.error("::error::brace-expansion versi RENTAN terpasang: " + bad.join(", "));
              console.error("GHSA-mh99-v99m-4gvg berlaku nyata utk versi ini — allowlist tak boleh membungkamnya. Naikkan/override ke versi patched.");
              process.exit(1);
            }
            console.log("OK — brace-expansion terpasang [" + ([...found].sort(cmp).join(", ") || "none") + "] semuanya patched.");
          '

      - name: Audit semua dependencies (warning only, tidak block)
        if: always()
        continue-on-error: true
        run: |
          echo "=== Full audit (including dev) ==="
          npm audit --audit-level=moderate || true

  # ─── JOB C: Code Quality Gate (tsc + eslint) ───────────────────────────────
  quality-gate:
    name: TypeScript + ESLint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ─── JOB D: Gitleaks (secret scanning) ─────────────────────────────────────
  # Scan working tree saat ini untuk rahasia ter-commit (token/password/key).
  # Pakai Docker image resmi (tanpa license/token — gratis untuk repo apa pun).
  # fetch-depth: 0 → history penuh tersedia kalau nanti mau ganti ke scan commit.
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan (config .gitleaks.toml)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo \
            --config=/repo/.gitleaks.toml \
            --redact --no-banner --verbose --exit-code=1
        # --exit-code=1: gagalkan CI kalau ada secret terdeteksi (block merge)
        # --redact: jangan cetak nilai secret di log Actions